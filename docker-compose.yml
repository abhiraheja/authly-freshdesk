services:
  postgres:
    image: postgres:16
    container_name: trackly-postgres
    environment:
      POSTGRES_DB: trackly
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly
    ports:
      - "5432:5432"
    volumes:
      - trackly-pgdata:/var/lib/postgresql/data

volumes:
  trackly-pgdata:
